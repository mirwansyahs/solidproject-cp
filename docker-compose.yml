version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci3_app
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - ci3-network

  db:
    image: mariadb:10.4
    container_name: ci3_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: solidproject_web
      MYSQL_USER: mirwansyahs
      MYSQL_PASSWORD: mirwansyahs123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ci3-network

volumes:
  db_data:

networks:
  ci3-network:
    driver: bridge